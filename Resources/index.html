<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=320, initial-scale=1, user-scalable=no">
<title>iPod</title>
<style>
  * { -webkit-box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; -webkit-touch-callout: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: "Helvetica Neue", Helvetica, sans-serif; touch-action: none; }
  body { background: -webkit-linear-gradient(left, #b3b5b8, #e8e9ea 28%, #d6d8da 55%, #f0f0f1 76%, #b0b2b5); }

  #screen { position: absolute; left: 14px; top: 14px; width: 292px; height: 262px; background: #0b0b0c;
            padding: 6px; -webkit-border-radius: 12px; -webkit-box-shadow: 0 1px 0 #fff, inset 0 0 6px #000; }
  #lcd { position: relative; width: 100%; height: 100%; background: #fff; -webkit-border-radius: 6px; overflow: hidden;
         -webkit-transform: translateZ(0); }
  #bar { height: 28px; line-height: 28px; text-align: center; font-size: 15px; font-weight: bold; color: #222; position: relative;
         background: -webkit-linear-gradient(top, #fafafa, #bfc3c8); border-bottom: 1px solid #9aa0a6; }
  #title { display: block; margin: 0 72px 0 64px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #pst { position: absolute; left: 8px; top: 0; font-size: 11px; color: #1b66cc; }
  #lockbadge { display: none; position: absolute; left: 24px; top: 0; font-size: 13px; }

  /* batterie */
  #batt { position: absolute; right: 12px; top: 7px; width: 28px; height: 13px; border: 1px solid #444; -webkit-border-radius: 3px;
          background: #fff; overflow: hidden; }
  #battfill { height: 100%; width: 0%; background: -webkit-linear-gradient(top, #9be07a, #3f9a2a); }
  #battfill.low { background: -webkit-linear-gradient(top, #f08a8a, #c62828); }
  #battfill.chg { -webkit-animation: chg 1.4s ease-in-out infinite; }
  @-webkit-keyframes chg { 0% { opacity: .45; } 50% { opacity: 1; } 100% { opacity: .45; } }
  #battnub { position: absolute; right: 8px; top: 10px; width: 3px; height: 7px; background: #444; -webkit-border-radius: 0 2px 2px 0; }
  #bolt { display: none; position: absolute; left: 0; top: 0; width: 100%; text-align: center; font-size: 10px; line-height: 13px; }
  #battpct { position: absolute; right: 46px; top: 0; font-size: 10px; font-weight: normal; color: #444; line-height: 28px; }

  #list { position: relative; height: 222px; overflow: hidden; }

  /* lignes de liste (7 lignes creees une seule fois, puis mises a jour) */
  .row { height: 31.7px; line-height: 31px; padding: 0 10px; font-size: 18px; color: #111; border-bottom: 1px solid #ececec;
         white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .sub { font-size: 12px; color: #8a8a8a; margin-left: 6px; }
  .row .arr { float: right; color: #9a9a9a; font-size: 13px; margin-left: 6px; }
  .row.sel { color: #fff; background: -webkit-linear-gradient(top, #5aa8f2, #1b66cc); border-bottom-color: #1b66cc; }
  .row.sel .arr, .row.sel .sub { color: #e6f0ff; }

  .txt { padding: 40px 16px; font-size: 16px; color: #333; text-align: center; line-height: 22px; }

  /* lecture en cours / radio */
  .np { position: relative; height: 222px; }
  .art { position: absolute; left: 10px; top: 10px; width: 90px; height: 90px; overflow: hidden; text-align: center;
         line-height: 90px; font-size: 42px; color: #9aa3ab; -webkit-border-radius: 3px;
         background: -webkit-linear-gradient(top, #eef0f2, #c9cdd2); -webkit-box-shadow: 0 2px 5px rgba(0,0,0,.35); }
  .art img { position: absolute; left: 0; top: 0; width: 90px; height: 90px; display: none; }
  .info { position: absolute; left: 110px; right: 8px; top: 12px; }
  .npt { font-size: 17px; font-weight: bold; color: #111; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .npa { font-size: 14px; color: #555; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 19px; }
  .npi { font-size: 12px; color: #888; margin-top: 6px; }
  .bot { position: absolute; left: 12px; right: 12px; top: 114px; }
  .prog { height: 9px; background: #d9dde1; -webkit-border-radius: 5px; overflow: hidden; }
  .prog div { height: 100%; width: 0; background: -webkit-linear-gradient(top, #5aa8f2, #1b66cc); }
  .prog.scrub div { background: -webkit-linear-gradient(top, #ffb74d, #ef6c00); }
  .tm { height: 16px; font-size: 12px; color: #555; margin-top: 3px; }
  .tm span:first-child { float: left; } .tm span:last-child { float: right; }
  .md { margin-top: 14px; height: 20px; line-height: 20px; font-size: 13px; color: #555; }
  .md .ml { display: inline-block; width: 78px; }
  .md .prog { display: inline-block; vertical-align: middle; width: 170px; }
  .md .mv { font-weight: bold; color: #1b66cc; }
  .rst { font-size: 15px; color: #1b66cc; margin-top: 10px; }
  .rst.err { color: #c62828; }

  /* horloge, chrono, heure */
  .clk { padding-top: 46px; text-align: center; }
  .big { font-size: 46px; font-weight: 200; color: #111; }
  .dt { font-size: 15px; color: #555; margin-top: 8px; }
  .hint { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; font-size: 11px; color: #888; }
  .sw { position: relative; height: 222px; padding-top: 24px; text-align: center; }
  .laps { margin: 10px 40px 0; font-size: 13px; color: #555; text-align: left; }
  .laps div { height: 18px; } .laps b { float: right; font-weight: normal; }
  .te { position: relative; height: 222px; padding-top: 52px; text-align: center; font-size: 54px; font-weight: 200; color: #111; }
  .te span { padding: 0 6px; -webkit-border-radius: 6px; }
  .te span.on { color: #fff; background: -webkit-linear-gradient(top, #5aa8f2, #1b66cc); }

  /* a propos */
  .ab { padding: 8px 14px; }
  .ab .h { font-size: 19px; font-weight: bold; text-align: center; margin-bottom: 4px; color: #111; }
  .kv { height: 22px; line-height: 22px; font-size: 14px; color: #222; border-bottom: 1px solid #eee; }
  .kv b { float: right; font-weight: normal; color: #666; }

  canvas { display: block; }

  /* surimpressions */
  #lockov { display: none; position: absolute; left: 95px; top: 80px; width: 90px; height: 90px; line-height: 90px;
            text-align: center; font-size: 46px; color: #fff; background: rgba(20,20,20,0.78);
            -webkit-border-radius: 14px; z-index: 5; }
  #letter { display: none; position: absolute; left: 96px; top: 81px; width: 88px; height: 88px; line-height: 88px;
            text-align: center; font-size: 56px; font-weight: bold; color: #fff; background: rgba(20,20,20,0.72);
            -webkit-border-radius: 12px; z-index: 6; }
  #toast { display: none; position: absolute; left: 16px; right: 16px; bottom: 12px; padding: 8px 10px; text-align: center;
           font-size: 13px; line-height: 17px; color: #fff; background: rgba(20,20,20,0.85); -webkit-border-radius: 10px; z-index: 7; }
  #dim { display: none; position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: #000; opacity: .9; z-index: 20; }

  #wheel { position: absolute; left: 72px; top: 292px; width: 176px; height: 176px; -webkit-border-radius: 88px;
           background: -webkit-radial-gradient(center, #fbfbfb 50%, #cfd1d3 100%); border: 1px solid #9fa2a5;
           -webkit-box-shadow: 0 1px 0 #fff; }
  #wheel span { position: absolute; font-size: 12px; font-weight: bold; color: #7c7f82; }
  #menu { top: 10px; left: 0; width: 100%; text-align: center; }
  #prev { left: 12px; top: 76px; }
  #next { right: 12px; top: 76px; }
  #play { bottom: 10px; left: 0; width: 100%; text-align: center; }
  #center { position: absolute; left: 53px; top: 53px; width: 70px; height: 70px; -webkit-border-radius: 35px;
            background: -webkit-radial-gradient(center, #f4f4f4, #cbcdcf); border: 1px solid #9fa2a5; }
  #dbg { display: none; position: absolute; left: 4px; bottom: 2px; font: 9px monospace; color: #444; }

  /* theme sombre */
  body.dark { background: -webkit-linear-gradient(left, #0c0c0d, #2a2b2d 28%, #1b1c1e 55%, #2e2f31 76%, #09090a); }
  body.dark #screen { background: #000; -webkit-box-shadow: 0 1px 0 #4a4b4d, inset 0 0 6px #000; }
  body.dark #lcd { background: #000; }
  body.dark #bar { color: #eee; background: -webkit-linear-gradient(top, #3d3e40, #17181a); border-bottom-color: #000; }
  body.dark #pst { color: #5aa8f2; }
  body.dark #batt { background: #222; border-color: #aaa; }
  body.dark #battnub { background: #aaa; }
  body.dark #battpct { color: #bbb; }
  body.dark .row { color: #f2f2f2; border-bottom-color: #1c1c1e; }
  body.dark .row .sub, body.dark .row .arr { color: #8e8e93; }
  body.dark .row.sel .arr, body.dark .row.sel .sub { color: #e6f0ff; }
  body.dark .txt { color: #ddd; }
  body.dark .npt, body.dark .big, body.dark .te, body.dark .ab .h { color: #fff; }
  body.dark .npa, body.dark .tm, body.dark .md, body.dark .dt, body.dark .laps { color: #aaa; }
  body.dark .art { color: #555; background: -webkit-linear-gradient(top, #2c2c2e, #151516); }
  body.dark .prog { background: #2c2c2e; }
  body.dark .kv { color: #eee; border-bottom-color: #1c1c1e; }
  body.dark .kv b { color: #999; }
  body.dark #wheel { background: -webkit-radial-gradient(center, #2c2c2e 50%, #101011 100%); border-color: #000; -webkit-box-shadow: 0 1px 0 #555; }
  body.dark #wheel span { color: #b5b7ba; }
  body.dark #center { background: -webkit-radial-gradient(center, #3c3c3e, #131314); border-color: #000; }
  body.dark #dbg { color: #aaa; }
</style>
</head>
<body>
<div id="screen"><div id="lcd">
  <div id="bar">
    <span id="pst"></span><span id="lockbadge">&#x1F512;</span><span id="title">iPod</span>
    <span id="battpct"></span><div id="batt"><div id="battfill"></div><span id="bolt">&#9889;</span></div><div id="battnub"></div>
  </div>
  <div id="list"></div>
  <div id="lockov">&#x1F512;</div>
  <div id="letter"></div>
  <div id="toast"></div>
</div></div>
<div id="wheel">
  <span id="menu">MENU</span><span id="prev">&#9664;&#9664;</span><span id="next">&#9654;&#9654;</span><span id="play">&#9654;&#10074;&#10074;</span>
  <div id="center"></div>
</div>
<div id="dbg"></div>
<div id="dim"></div>

<script>
(function () {
  var VERSION = '0.1.0';
  var HOLD_ENABLED = true;    // false = ignore l'interrupteur silencieux
  var VISIBLE = 7;

  function $(id) { return document.getElementById(id); }
  var listEl = $('list'), titleEl = $('title'), wheel = $('wheel'), lockov = $('lockov'), badge = $('lockbadge'),
      pstEl = $('pst'), dbgEl = $('dbg'), letterEl = $('letter'), toastEl = $('toast'), dimEl = $('dim');

  function now() { return +new Date(); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function enc(s) { return encodeURIComponent(s == null ? '' : s); }
  function z(x) { x = +x; return (x < 10 ? '0' : '') + x; }
  function mmss(x) { x = Math.max(0, Math.floor(x || 0)); var h = Math.floor(x / 3600), m = Math.floor(x / 60) % 60, s = x % 60;
                     return (h ? h + ':' + z(m) : m) + ':' + z(s); }

  // une erreur JS ne doit jamais figer l'interface
  window.onerror = function (m, f, l) { try { dbgEl.textContent = 'ERR ' + m + ' @' + l; } catch (x) {} return true; };

  /* =========================== reglages =========================== */
  var DEF = { theme: 'light', clicker: '1', backlight: '30', hidden: '', kiosk: '0', diag: '0',
              brick: '0', alarmOn: '0', alarmH: '7', alarmM: '0' };
  var P = {}, k;
  for (k in DEF) P[k] = DEF[k];

  function applyPrefs() {
    document.body.className = P.theme === 'dark' ? 'dark' : '';
    dbgEl.style.display = P.diag === '1' ? 'block' : 'none';
    send('idle?off=' + (P.backlight === '0' ? 1 : 0));
  }
  function setPref(key, v) { P[key] = String(v); send('setpref?k=' + enc(key) + '&v=' + enc(P[key])); applyPrefs(); }

  /* =========================== pont natif =========================== */
  // Les commandes vont dans une file ; une seule iframe (reutilisee) previent le natif,
  // qui vide la file d'un coup avec window.__drain().
  var queue = [], flushPending = false, frame = null, fseq = 0, lastClick = 0;
  window.__drain = function () { var s = queue.join('\n'); queue = []; return s; };
  function flush() {
    flushPending = false;
    if (!queue.length) return;
    if (!frame) { frame = document.createElement('iframe'); frame.style.display = 'none'; document.body.appendChild(frame); }
    frame.src = 'ipod://flush/' + (++fseq);
  }
  function send(cmd) { queue.push(cmd); if (!flushPending) { flushPending = true; setTimeout(flush, 0); } }
  setInterval(function () { if (queue.length && !flushPending) flush(); }, 500);   // filet de securite
  function click() {
    if (P.clicker !== '1') return;
    var t = now(); if (t - lastClick < 40) return;
    lastClick = t; send('click');
  }

  /* =========================== etat =========================== */
  var np = { t: '', a: '', al: '', pos: 0, dur: 0, st: 0, vol: 0.5, idx: 0, cnt: 0, sh: 'off', rp: 'off', art: '', at: now() };
  var radio = { st: 0, n: '', i: -1 };
  var bri = 0.5, hold = false, holdKnown = false, holdMs = -1, rid = 0, stats = null, sleepEnd = 0, sleepMin = 0;

  function curPos() { var p = np.st === 1 ? np.pos + (now() - np.at) / 1000 : np.pos; return np.dur > 0 ? clamp(p, 0, np.dur) : Math.max(0, p); }
  function radioOn() { return radio.st === 1 || radio.st === 2; }

  // Webradios (HTTP simple : iOS 6 gere mal le HTTPS recent). Pour en ajouter : copie une ligne.
  var RADIOS = [
    ['France Inter',   'http://icecast.radiofrance.fr/franceinter-midfi.mp3'],
    ['franceinfo',     'http://icecast.radiofrance.fr/franceinfo-midfi.mp3'],
    ['France Culture', 'http://icecast.radiofrance.fr/franceculture-midfi.mp3'],
    ['France Musique', 'http://icecast.radiofrance.fr/francemusique-midfi.mp3'],
    ['FIP',            'http://icecast.radiofrance.fr/fip-midfi.mp3'],
    ['Mouv’',     'http://icecast.radiofrance.fr/mouv-midfi.mp3']
  ];

  /* =========================== menus =========================== */
  var SH = [['off', 'Non'], ['songs', 'Morceaux'], ['albums', 'Albums']];
  var RP = [['off', 'Non'], ['one', 'Un'], ['all', 'Tout']];
  var BL = [['10', '10 secondes'], ['30', '30 secondes'], ['60', '1 minute'], ['120', '2 minutes'], ['0', 'Toujours allumé']];
  var BL_SHORT = { '10': '10 s', '30': '30 s', '60': '1 min', '120': '2 min', '0': 'Toujours' };
  var TH = [['light', 'Clair'], ['dark', 'Sombre']];
  var SLEEP = [0, 15, 30, 60, 90, 120];

  function label(list, v) { for (var i = 0; i < list.length; i++) if (list[i][0] === v) return list[i][1]; return ''; }
  function yesNo(key) { return function () { return P[key] === '1' ? 'Oui' : 'Non'; }; }

  // sous-menu de choix pour un reglage (coche sur la valeur courante)
  function prefChoices(key, list, after) {
    return function () {
      return list.map(function (o) {
        return { t: o[1], act: { type: 'pref', k: key, v: o[0], after: after }, check: function () { return P[key] === o[0]; } };
      });
    };
  }
  function modeChoices(key, list) {
    return function () {
      return list.map(function (o) {
        return { t: o[1], act: { type: 'mode', k: key, v: o[0] }, check: function () { return np[key] === o[0]; } };
      });
    };
  }

  var ROOT_DEF = [
    ['music', 'Musique', { type: 'menu', items: musicMenu }],
    ['videos', 'Vidéos', { type: 'src', src: 'videos' }],
    ['podcasts', 'Podcasts', { type: 'src', src: 'podcasts' }],
    ['radio', 'Radio', { type: 'menu', items: radioMenu }],
    ['extras', 'Extras', { type: 'menu', items: extrasMenu }],
    ['settings', 'Réglages', { type: 'menu', items: settingsMenu }],
    ['shuffle', 'Lecture aléatoire', { type: 'shuffle', src: 'songs' }],
    ['np', 'Lecture en cours', { type: 'np' }]
  ];
  function isHidden(key) { return (',' + P.hidden + ',').indexOf(',' + key + ',') >= 0; }
  function rootMenu() {
    var out = [];
    ROOT_DEF.forEach(function (r) {
      if (r[0] !== 'settings' && isHidden(r[0])) return;
      if (r[0] === 'np' && !np.t && !radioOn()) return;          // comme sur l'iPod : seulement s'il y a une lecture
      out.push({ t: r[1], act: r[2] });
    });
    return out;
  }
  function musicMenu() {
    return [
      { t: 'Playlists',  act: { type: 'src', src: 'playlists' } },
      { t: 'Artistes',   act: { type: 'src', src: 'artists' } },
      { t: 'Albums',     act: { type: 'src', src: 'albums' } },
      { t: 'Morceaux',   act: { type: 'src', src: 'songs' } },
      { t: 'Genres',     act: { type: 'src', src: 'genres' } },
      { t: 'Compilations', act: { type: 'src', src: 'compilations' } },
      { t: 'Compositeurs', act: { type: 'src', src: 'composers' } },
      { t: 'Livres audio', act: { type: 'src', src: 'audiobooks' } },
      { t: 'Top 25',     act: { type: 'src', src: 'top' } },
      { t: 'Écoutés récemment', act: { type: 'src', src: 'recent' } }
    ];
  }
  function radioMenu() {
    return RADIOS.map(function (r, i) {
      return { t: r[0], act: { type: 'radio', i: i }, val: function () { return (radio.i === i && radioOn()) ? '♪' : ''; } };
    });
  }
  function sleepLabel() {
    if (!sleepEnd || now() > sleepEnd) return 'Non';
    return Math.ceil((sleepEnd - now()) / 60000) + ' min';
  }
  function sleepMenu() {
    return SLEEP.map(function (m) {
      return { t: m ? m + ' minutes' : 'Non', act: { type: 'sleep', m: m },
               check: function () { return m ? (sleepEnd > now() && sleepMin === m) : !(sleepEnd > now()); } };
    });
  }
  function alarmMenu() {
    return [
      { t: 'Réveil', val: yesNo('alarmOn'), act: { type: 'toggle', k: 'alarmOn', after: function (on) {
          toast(on ? 'Réveil activé à ' + z(P.alarmH) + ':' + z(P.alarmM) : 'Réveil désactivé'); } } },
      { t: 'Heure', val: function () { return z(P.alarmH) + ':' + z(P.alarmM); }, act: { type: 'screen', screen: 'time', title: 'Heure du réveil' } },
      { t: 'Tester le réveil', act: { type: 'fn', fn: function () { send('alarmtest'); } } }
    ];
  }
  function extrasMenu() {
    return [
      { t: 'Horloge', act: { type: 'screen', screen: 'clock', title: 'Horloge' } },
      { t: 'Réveil', val: function () { return P.alarmOn === '1' ? z(P.alarmH) + ':' + z(P.alarmM) : 'Non'; }, act: { type: 'menu', items: alarmMenu } },
      { t: 'Chronomètre', act: { type: 'screen', screen: 'sw', title: 'Chronomètre' } },
      { t: 'Minuterie de veille', val: sleepLabel, act: { type: 'menu', items: sleepMenu } },
      { t: 'Jeux', act: { type: 'menu', items: function () {
          return [{ t: 'Brick', val: function () { return P.brick !== '0' ? '★ ' + P.brick : ''; }, act: { type: 'screen', screen: 'brick', title: 'Brick' } }];
        } } }
    ];
  }
  function mainMenuItems() {
    return ROOT_DEF.filter(function (r) { return r[0] !== 'settings'; }).map(function (r) {
      return { t: r[1], val: function () { return isHidden(r[0]) ? 'Non' : 'Oui'; }, act: { type: 'fn', fn: function () {
        var l = P.hidden ? P.hidden.split(',') : [], i = l.indexOf(r[0]);
        if (i >= 0) l.splice(i, 1); else l.push(r[0]);
        setPref('hidden', l.join(','));
        draw();
      } } };
    });
  }
  function settingsMenu() {
    return [
      { t: 'À propos', act: { type: 'screen', screen: 'about', title: 'À propos' } },
      { t: 'Aléatoire', val: function () { return label(SH, np.sh); }, act: { type: 'menu', items: modeChoices('sh', SH) } },
      { t: 'Répéter', val: function () { return label(RP, np.rp); }, act: { type: 'menu', items: modeChoices('rp', RP) } },
      { t: 'Rétroéclairage', val: function () { return BL_SHORT[P.backlight] || ''; }, act: { type: 'menu', items: prefChoices('backlight', BL) } },
      { t: 'Luminosité', val: function () { return Math.round(bri * 100) + ' %'; }, act: { type: 'screen', screen: 'bright', title: 'Luminosité' } },
      { t: 'Minuterie de veille', val: sleepLabel, act: { type: 'menu', items: sleepMenu } },
      { t: 'Clicker', val: yesNo('clicker'), act: { type: 'toggle', k: 'clicker' } },
      { t: 'Thème', val: function () { return label(TH, P.theme); }, act: { type: 'menu', items: prefChoices('theme', TH) } },
      { t: 'Menu principal', act: { type: 'menu', items: mainMenuItems } },
      { t: 'Écran d’accueil', val: yesNo('kiosk'), act: { type: 'toggle', k: 'kiosk', after: function (on) {
          toast(on ? 'L’iPod remplace l’écran d’accueil.\nQuitter : Home + Vol+ + Vol−' : 'Écran d’accueil normal rétabli', 3500); } } },
      { t: 'Diagnostic', val: yesNo('diag'), act: { type: 'toggle', k: 'diag' } },
      { t: 'Réinitialiser', act: { type: 'menu', items: function () {
          return [{ t: 'Annuler', act: { type: 'fn', fn: back } },
                  { t: 'Réinitialiser les réglages', act: { type: 'fn', fn: resetPrefs } }];
        } } }
    ];
  }

    draw: function () { useHtml('<canvas id="cv" width="280" height="222"></canvas>'); gameDraw(); },
    leave: function () { if (G) { if (!G.stuck && !G.over) G.paused = true; if (G.raf) { caf(G.raf); G.raf = null; } } },
    step: function (s, dir, mult) { G.px = clamp(G.px + dir * 12 * Math.min(mult, 3), G.pw / 2, 280 - G.pw / 2); if (!gameRunning()) gameDraw(); },
    center: function () {
      if (G.over) { G = newGame(); gameDraw(); return; }
      if (G.stuck) { G.stuck = false; G.paused = false; var a = (Math.random() - 0.5) * 0.8; G.vx = G.speed * Math.sin(a); G.vy = -G.speed * Math.cos(a); }
      else G.paused = !G.paused;
      gameDraw(); gameStart();
    }
  };

  /* =========================== transport =========================== */
  function updBar() {
    var playing = radioOn() || np.st === 1;
    pstEl.textContent = playing ? '▶' : (np.t ? '❚❚' : '');
  }
  function updAll() {
    updBar();
    var s = cur(); if (!s) return;
    if (s.type === 'np' || s.type === 'radio') S[s.type].upd(s);
    else if (s.type === 'list' && !s.loading) S.list.draw(s);
  }
  function tPlay() {
    if (radioOn() || (radio.i >= 0 && cur().type === 'radio')) { send('radiotoggle'); radio.st = radioOn() ? 0 : 1; }
    else { send('playpause'); np.pos = curPos(); np.at = now(); np.st = np.st === 1 ? 0 : 1; }
    updAll();
  }
  function tNext() { if (radioOn()) startRadio((radio.i + 1) % RADIOS.length); else send('next'); }
  function tPrev() {
    if (radioOn()) { startRadio((radio.i - 1 + RADIOS.length) % RADIOS.length); return; }
    if (curPos() > 3) { send('seek?t=0'); np.pos = 0; np.at = now(); updAll(); }   // comme l'iPod : debut du morceau
    else send('prev');
  }

  /* =========================== minuterie / veille / retroeclairage =========================== */
  function setSleep(m, quiet) {
    sleepMin = m; sleepEnd = m ? now() + m * 60000 : 0;
    send('sleep?m=' + m);
    if (!quiet) toast(m ? 'Arrêt de la lecture dans ' + m + ' min' : 'Minuterie désactivée');
  }
  var lastAct = now(), dimmed = false;
  function dim(on) { if (dimmed === on) return; dimmed = on; dimEl.style.display = on ? 'block' : 'none'; send('dim?on=' + (on ? 1 : 0)); }
  setInterval(function () {
    var secs = +P.backlight;
    if (secs > 0 && !dimmed && now() - lastAct > secs * 1000 && !gameRunning()) dim(true);
  }, 1000);

  /* =========================== surimpressions =========================== */
  var letterT = null, toastT = null, ovTimer = null;
  var ACC = 'ÀÁÂÄÃÅÇÈÉÊËÌÍÎÏÑÒÓÔÖÕÙÚÛÜÝ',
      PLAIN = 'AAAAAACEEEEIIIINOOOOOUUUUY';
  function showLetter(t) {
    var c = String(t || '').charAt(0).toUpperCase(), j = ACC.indexOf(c);
    if (j >= 0) c = PLAIN.charAt(j);
    if (!/[A-Z]/.test(c)) c = '#';
    letterEl.textContent = c; letterEl.style.display = 'block';
    clearTimeout(letterT); letterT = setTimeout(function () { letterEl.style.display = 'none'; }, 700);
  }
  function toast(msg, ms) {
    toastEl.innerHTML = esc(msg).replace(/\n/g, '<br>'); toastEl.style.display = 'block';
    clearTimeout(toastT); toastT = setTimeout(function () { toastEl.style.display = 'none'; }, ms || 1800);
  }
  function flashLock(open) {
    lockov.innerHTML = open ? '&#x1F513;' : '&#x1F512;';
    lockov.style.display = 'block';
    clearTimeout(ovTimer); ovTimer = setTimeout(function () { lockov.style.display = 'none'; }, 900);
  }

  /* =========================== appels du natif =========================== */
  var NEXT = { artists: 'albums-artist', albums: 'songs-album', genres: 'songs-genre', playlists: 'songs-playlist',
               compilations: 'songs-album', composers: 'songs-composer', 'albums-artist': 'songs-album' };
  window.onList = function (o) {
    var s = cur();
    if (s.type !== 'list' || s.rid !== o.rid) return;
    var out = [], src = o.src, items = o.items || [], i, r;
    if (src === 'playlists') out.push({ t: 'On-The-Go', s: o.otg ? o.otg + ' morceau' + (o.otg > 1 ? 'x' : '') : '', act: { type: 'src', src: 'otg' } });
    if (src === 'albums-artist') out.push({ t: 'Tous les morceaux', act: { type: 'src', src: 'songs-artist', id: s.pid } });
    if (!NEXT[src] && src !== 'videos' && items.length > 1) out.push({ t: 'Lecture aléatoire', act: { type: 'shuffle', src: src, id: s.pid } });
    for (i = 0; i < items.length; i++) {
      r = items[i];
      var a = NEXT[src] ? { type: 'src', src: NEXT[src], id: r[2] } : src === 'videos' ? { type: 'video', i: i } : { type: 'play', src: src, id: s.pid, i: i };
      out.push({ t: r[0] || '', s: r[1] || '', act: a });
    }
    if (src === 'otg' && items.length) out.push({ t: 'Effacer la liste', act: { type: 'fn', fn: function () { send('otgclear'); back(); toast('On-The-Go effacée'); } } });
    s.items = out; s.loading = false; s.sel = 0; s.off = 0;
    if (src === 'otg' && !items.length) s.items = [];
    draw();
  };
  window.onNP = function (o) {
    var had = !!np.t;
    for (var key in o) np[key] = o[key];
    np.at = now();
    if (o.st === 1 && radio.st) radio.st = 0;
    var s = cur();
    if (s && s.build === rootMenu && had !== !!np.t) S.list.enter(s);
    updAll();
  };
  window.onRadio = function (o) { radio.st = o.st; if (o.n) radio.n = o.n; updAll(); };
  window.onBright = function (o) { bri = o.v; if (cur().type === 'bright') S.bright.upd(); };
  window.onStats = function (o) { stats = o; if (cur().type === 'about') draw(); };
  window.onToast = function (o) { toast(o.m, o.ms); };
  window.onAlarm = function () { lastAct = now(); dim(false); if (cur().type !== 'alarm') push({ type: 'alarm', title: 'Réveil' }); };
  window.onSleepDone = function () { sleepEnd = 0; np.st = 0; radio.st = 0; updAll(); toast('Minuterie : lecture arrêtée'); dim(true); };
  window.wake = function () { lastAct = now(); dim(false); };
  window.loadPrefs = function (o) {
    for (var key in DEF) if (o && o[key] != null) P[key] = String(o[key]);
    applyPrefs();
    var s = cur(); if (s && s.type === 'list') { if (s.build) S.list.enter(s); draw(); }
  };
  window.setTheme = function (v) { P.theme = v === 'dark' ? 'dark' : 'light'; applyPrefs(); };   // compatibilite

  window.setBattery = function (p, st) {
    var fill = $('battfill'), bolt = $('bolt'), pct = $('battpct');
    var charging = (st === 2), full = (st === 3);
    if (p < 0) { fill.style.width = '100%'; fill.className = ''; pct.textContent = ''; bolt.style.display = 'none'; return; }
    fill.style.width = Math.max(4, p) + '%';
    fill.className = (p <= 20 && !charging && !full) ? 'low' : (charging ? 'chg' : '');
    pct.textContent = p + '%';
    bolt.style.display = charging ? 'block' : 'none';
  };

  /* ---------- mode Hold (interrupteur silencieux) ---------- */
  window.setHold = function (h, ms) {
    holdMs = ms;
    if (!HOLD_ENABLED) return;
    var nh = !!h, changed = (nh !== hold);
    hold = nh;
    badge.style.display = hold ? 'block' : 'none';
    if (hold) { T.on = false; clearTimeout(T.holdT); }
    if (changed && (holdKnown || hold)) flashLock(!hold);
    holdKnown = true;
    dbg('');
  };

  function dbg(extra) {
    if (P.diag !== '1') return;
    dbgEl.textContent = 'H' + (hold ? 1 : 0) + ' ms' + holdMs + ' v' + T.vel.toFixed(2) + ' q' + queue.length + ' ' + extra;
  }

  /* =========================== molette =========================== */
  var WC = { x: 160, y: 380 };
  function measure() { var r = wheel.getBoundingClientRect(); WC.x = r.left + r.width / 2; WC.y = r.top + r.height / 2; }
  measure(); window.addEventListener('resize', measure, false);
  function polar(t) { var dx = t.clientX - WC.x, dy = t.clientY - WC.y; return { a: Math.atan2(dy, dx) * 57.29578, d: Math.sqrt(dx * dx + dy * dy) }; }

  var STEP = 20, RING_MIN = 38, RING_MAX = 88, TAP_PX = 14;
  var HOLD_MS = { center: 650, menu: 800, next: 500, prev: 500, play: 1500 };
  var T = { on: false, zone: '', sx: 0, sy: 0, last: 0, acc: 0, lt: 0, vel: 0, scrolled: false, moved: false, inRing: false, holdT: null, held: false, seek: false };

  function zoneOf(p) {
    if (p.d < RING_MIN) return 'center';
    var a = p.a;                                 // -90 haut, 0 droite, 90 bas, +-180 gauche
    if (a > -135 && a <= -45) return 'menu';
    if (a > -45 && a <= 45) return 'next';
    if (a > 45 && a <= 135) return 'play';
    return 'prev';
  }
  function onHold() {
    if (!T.on || T.scrolled || T.moved) return;
    T.held = true;
    var s = cur(), h = S[s.type];
    if (T.zone === 'center') { if (h.hold) { h.hold(s); click(); } }
    else if (T.zone === 'menu') { home(); click(); }
    else if (T.zone === 'next' || T.zone === 'prev') {
      if (!radioOn() && np.t && !h.next) { T.seek = true; send(T.zone === 'next' ? 'seekfwd' : 'seekbwd'); }
    } else if (T.zone === 'play') { send('pause'); np.st = 0; radio.st = 0; updAll(); dim(true); }   // maintenir = veille, comme l'iPod
  }
  function doStep(dir) {
    T.scrolled = true; clearTimeout(T.holdT);
    var mult = T.vel > 0.9 ? 8 : (T.vel > 0.5 ? 3 : 1);     // acceleration quand on tourne vite
    var s = cur(), h = S[s.type];
    if (h.step) h.step(s, dir, mult);
  }
  function press(zone) {
    var s = cur(), h = S[s.type];
    if (zone === 'center') { if (h.center) h.center(s); }
    else if (zone === 'menu') { if (h.menu) h.menu(s); else back(); }
    else if (zone === 'next') { if (h.next) h.next(s); else tNext(); }
    else if (zone === 'prev') { if (h.prev) h.prev(s); else tPrev(); }
    else if (zone === 'play') { if (h.play) h.play(s); else tPlay(); }
  }

  document.addEventListener('touchstart', function (e) {
    e.preventDefault();
    if (e.touches.length > 1) return;
    var t = e.touches[0], p = polar(t);
    lastAct = now();
    if (dimmed) { dim(false); T.on = false; return; }         // le premier contact rallume seulement l'ecran
    if (p.d > RING_MAX + 6) { T.on = false; return; }
    if (hold) { T.on = false; flashLock(false); return; }    // verrouille : on ignore tout
    T.on = true; T.zone = zoneOf(p); T.sx = t.clientX; T.sy = t.clientY;
    T.last = p.a; T.acc = 0; T.lt = now(); T.vel = 0;
    T.scrolled = false; T.moved = false; T.held = false; T.seek = false; T.inRing = p.d >= RING_MIN;
    clearTimeout(T.holdT); T.holdT = setTimeout(onHold, HOLD_MS[T.zone]);
  }, false);

  document.addEventListener('touchmove', function (e) {
    e.preventDefault();
    if (!T.on || hold || T.seek) return;
    var t = e.touches[0], q = polar(t), dx = t.clientX - T.sx, dy = t.clientY - T.sy;
    if (!T.moved && dx * dx + dy * dy > TAP_PX * TAP_PX) { T.moved = true; if (!T.held) clearTimeout(T.holdT); }
    lastAct = now();
    if (q.d >= RING_MIN && q.d <= RING_MAX + 20) {          // seule la couronne fait defiler
      if (T.inRing) {
        var d = q.a - T.last, tn = now(), dt = Math.max(8, tn - T.lt);
        if (d > 180) d -= 360;
        if (d < -180) d += 360;
        T.vel = T.vel * 0.6 + Math.abs(d) / dt * 0.4; T.lt = tn;
        T.acc += d;
        while (T.acc >= STEP)  { T.acc -= STEP; doStep(1); }
        while (T.acc <= -STEP) { T.acc += STEP; doStep(-1); }
      }
      T.last = q.a; T.inRing = true;
    } else {
      T.inRing = false;
    }
    if (P.diag === '1') dbg('a' + Math.round(q.a));
  }, false);

  document.addEventListener('touchend', function (e) {
    e.preventDefault();
    clearTimeout(T.holdT);
    if (!T.on) return;
    T.on = false;
    if (T.seek) { send('seekend'); return; }
    if (T.held || hold || T.scrolled || T.moved) return;    // rotation ou appui long : pas un clic
    click();
    press(T.zone);
  }, false);

  document.addEventListener('touchcancel', function () { clearTimeout(T.holdT); if (T.seek) send('seekend'); T.on = false; }, false);

  /* =========================== demarrage =========================== */
  stack.push({ type: 'list', title: 'iPod', items: [], sel: 0, off: 0, build: rootMenu });
  applyPrefs();
  show();
})();
</script>
</body>
</html>
